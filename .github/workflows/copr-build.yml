name: Trigger COPR build

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: copr-build
  cancel-in-progress: true

jobs:
  trigger:
    name: Trigger COPR webhook
    runs-on: ubuntu-latest
    steps:
      - name: Call COPR webhook
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "${COPR_WEBHOOK_URL}" ]; then
            echo "::error::COPR_WEBHOOK_URL secret is not set"
            exit 1
          fi

          status=$(curl -H "Content-Type: application/json" --silent --output /dev/null --write-out '%{http_code}' \
            -X POST "${COPR_WEBHOOK_URL}")
          if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
            echo "COPR webhook triggered successfully (HTTP ${status})"
          else
            echo "::error::COPR webhook returned HTTP ${status}"
            exit 1
          fi
